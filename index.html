<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AG Farmedge Global v6</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="cardShadowStyle"></style>
<style id="animStyle">.no-animations *{animation:none!important;transition:none!important}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07071a;--card:#0e0e24;--sidebar:#0b0b1e;--border:#1a1a38;--borderL:#2a2a50;
  --text:#cccce0;--dim:#7777a0;--faint:#44445a;--white:#f0f0ff;
  --onion:#e8533a;--cotton:#4fa8e8;--profit:#3db87a;--loss:#e84444;
  --amber:#f0a020;--purple:#a070e0;--input:#12122c;--header:#090920;
  --radius:12px;--radius-sm:8px;
  --font-size-base:13px;--nav-height:54px;--card-padding:12px;--page-padding:14px;
  --nav-icon-size:17px;--nav-label-size:9px;
}

/* ── THEME: LIGHT ─────────────────────────── */
body.theme-light{
  --bg:#f0f2f7;
  --card:#ffffff;
  --sidebar:#e4e7ef;
  --border:#d0d4e0;
  --borderL:#b0b8cc;
  --text:#1e2030;        /* dark body text — readable on white cards */
  --dim:#4a5068;         /* secondary text — dark enough on light bg */
  --faint:#8890a8;       /* muted labels */
  --white:#0d0f1a;       /* used for headings/titles — near-black on light */
  --input:#f5f6fa;
  --header:#ffffff;
  /* keep accent/profit/loss colours vivid so they read on white */
  --onion:#d44020;
  --cotton:#1a7ec8;
  --profit:#1a8f50;
  --loss:#c83030;
  --amber:#b87000;
  --purple:#7040c0;
}
/* ── THEME: FOREST ────────────────────────── */
body.theme-forest{
  --bg:#071410;--card:#0d1f18;--sidebar:#091a13;--border:#1a3026;--borderL:#2a4a38;
  --text:#c0d8c8;--dim:#6a9a7a;--faint:#3a5a48;--white:#e8f8f0;
  --onion:#5db87a;--cotton:#48c890;--profit:#78d898;--loss:#e84444;
  --amber:#b8d040;--purple:#70c0a0;--input:#0a1a12;--header:#060f0b;
}
/* ── THEME: SAFFRON ───────────────────────── */
body.theme-saffron{
  --bg:#1a0e00;--card:#241400;--sidebar:#1c1000;--border:#382000;--borderL:#503000;
  --text:#e8d0a0;--dim:#a07840;--faint:#604820;--white:#fff0d0;
  --onion:#f07020;--cotton:#e8a030;--profit:#90c848;--loss:#e84444;
  --amber:#f8c020;--purple:#d080e0;--input:#180c00;--header:#120800;
}
/* ── THEME: OCEAN ─────────────────────────── */
body.theme-ocean{
  --bg:#020d1a;--card:#051525;--sidebar:#03101e;--border:#0a2030;--borderL:#103050;
  --text:#a8c8e8;--dim:#4880a8;--faint:#204060;--white:#d8f0ff;
  --onion:#20a8e8;--cotton:#40c0f8;--profit:#38d898;--loss:#e85050;
  --amber:#f8a820;--purple:#8080f0;--input:#031020;--header:#010b15;
}
/* ── THEME: SLATE ─────────────────────────── */
body.theme-slate{
  --bg:#0c0c0c;--card:#181818;--sidebar:#141414;--border:#282828;--borderL:#383838;
  --text:#c8c8c8;--dim:#707070;--faint:#404040;--white:#f0f0f0;
  --onion:#e06060;--cotton:#60a8e0;--profit:#60c878;--loss:#e05050;
  --amber:#d8a040;--purple:#a070c8;--input:#101010;--header:#080808;
}

/* ── COMPACT / COMFORTABLE DENSITY ───────── */
body.density-compact{
  --card-padding:8px;--page-padding:10px;--nav-height:46px;--font-size-base:12px;
}
body.density-comfortable{
  --card-padding:16px;--page-padding:18px;--nav-height:60px;--font-size-base:14px;
}

/* ── BORDER RADIUS SCALES ─────────────────── */
body.radius-sharp{ --radius:4px;--radius-sm:3px; }
body.radius-medium{ --radius:8px;--radius-sm:6px; }
body.radius-pill{ --radius:20px;--radius-sm:12px; }

/* ── SETTINGS PAGE ────────────────────────── */
.settings-section{margin-bottom:20px}
.settings-section-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-swatch{border:2px solid var(--border);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;transition:all .15s;background:var(--card)}
.theme-swatch.active{border-color:var(--onion);box-shadow:0 0 0 2px var(--onion)33}
.theme-swatch-preview{height:28px;border-radius:6px;margin-bottom:6px;display:flex;gap:3px;padding:4px;overflow:hidden}
.theme-swatch-preview span{flex:1;border-radius:3px}
.theme-swatch-name{font-size:10px;font-weight:700;color:var(--text)}
.option-row{display:flex;gap:8px;flex-wrap:wrap}
.option-chip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--borderL);font-size:11px;font-weight:700;cursor:pointer;color:var(--dim);background:var(--card);transition:all .15s;font-family:'Noto Sans',sans-serif}
.option-chip.active{border-color:var(--onion);color:var(--onion);background:var(--onion)15}
.color-picker-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.color-picker-row label{font-size:11px;color:var(--dim);flex:1;font-weight:600}
.color-picker-row input[type=color]{width:40px;height:32px;border:1.5px solid var(--borderL);border-radius:8px;cursor:pointer;padding:2px;background:var(--input)}
.settings-divider{height:1px;background:var(--border);margin:6px 0 14px}
.brand-preview{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.range-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.range-row label{font-size:11px;color:var(--dim);width:100px;font-weight:600}
.range-row input[type=range]{flex:1;accent-color:var(--onion)}
.range-row span{font-size:11px;color:var(--text);width:32px;text-align:right}
.nav-style-preview{display:flex;border-radius:8px;overflow:hidden;border:1.5px solid var(--borderL);margin-bottom:8px}
.nav-style-preview span{flex:1;padding:6px 4px;text-align:center;font-size:9px;font-weight:700;color:var(--dim);background:var(--card)}
.reset-section{margin-top:6px;padding-top:14px;border-top:1px solid var(--border)}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Noto Sans',sans-serif;color:var(--text);display:flex;flex-direction:column;font-size:var(--font-size-base)}
body.font-baloo *:not(.logo-text):not(.logo-sub):not(.nav-label):not(.page-title):not(.modal-title):not(.stat-mini-val):not(.dash-stat-val):not(.total-preview-val):not(.pl-total-val):not(.activity-amt):not(.party-stat-val):not(.report-section-title){font-family:'Baloo 2',sans-serif}
body.font-mono{font-family:'Courier New',Courier,monospace}

/* HEADER */
.app-header{background:var(--header);border-bottom:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:22px}
.logo-text{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--white);letter-spacing:.3px}
.logo-sub{font-size:9px;color:var(--onion);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.sync-area{display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s}
.sync-dot.synced{background:var(--profit)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.offline{background:var(--loss)}
.sync-label{font-size:10px;color:var(--dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.firebase-btn{background:transparent;border:1px solid var(--borderL);color:var(--dim);font-size:10px;padding:4px 9px;border-radius:6px;cursor:pointer;font-family:'Noto Sans',sans-serif;transition:all .2s}
.firebase-btn:hover{border-color:var(--onion);color:var(--onion)}

/* LAYOUT */
.app-body{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column; /* default: column = page-area on top, nav on bottom */
  min-height:0;
}
.page-area{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
  min-height:0;min-width:0;
  order:1; /* default: page-area before nav in column layout */
}
.page{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.page.active{display:flex}
.page-scroll{flex:1;overflow-y:auto;padding:var(--page-padding);padding-bottom:4px}
.page-scroll::-webkit-scrollbar{width:3px}
.page-scroll::-webkit-scrollbar-track{background:transparent}
.page-scroll::-webkit-scrollbar-thumb{background:var(--borderL);border-radius:3px}

/* NAV BASE — default bottom bar */
.bottom-nav{
  background:var(--sidebar);
  display:flex;flex-direction:row;flex-shrink:0;flex-wrap:nowrap;
  border-top:1px solid var(--border);
  min-height:var(--nav-height);
  order:2; /* appears after page-area in column layout */
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:7px 2px 6px;cursor:pointer;gap:2px;
  border-top:3px solid transparent;
  border-bottom:3px solid transparent;
  border-left:3px solid transparent;
  border-right:3px solid transparent;
  transition:border-color .15s,background .15s;
}
.nav-item.active{border-top-color:var(--onion)}
.nav-icon{font-size:var(--nav-icon-size);line-height:1.2;display:block;text-align:center}
.nav-label{font-size:var(--nav-label-size);font-weight:700;color:var(--faint);font-family:'Baloo 2',sans-serif;line-height:1.2;white-space:nowrap}
.nav-item.active .nav-label{color:var(--onion)}

/* NAV STYLE: PILL */
body.nav-pill .bottom-nav{padding:5px 8px;gap:3px}
body.nav-pill .nav-item{
  border-top-color:transparent!important;border-bottom-color:transparent!important;
  border-left-color:transparent!important;border-right-color:transparent!important;
  border-radius:10px;padding:6px 2px;
}
body.nav-pill .nav-item.active{background:rgba(232,83,58,0.15);}

/* ── NAV POSITION: TOP ──────────────────────── */
body.nav-top .app-body{flex-direction:column}
body.nav-top .page-area{order:2}
body.nav-top .bottom-nav{
  order:1;
  flex-direction:row;
  border-top:none;
  border-bottom:1px solid var(--border);
  min-height:var(--nav-height);
  width:100%;
}
body.nav-top .nav-item{
  border-top-color:transparent!important;
  border-left-color:transparent!important;border-right-color:transparent!important;
  border-bottom:3px solid transparent;
  padding:6px 2px 7px;
}
body.nav-top .nav-item.active{
  border-bottom-color:var(--onion)!important;
  border-top-color:transparent!important;
}

/* ── NAV POSITION: LEFT ─────────────────────── */
body.nav-left .app-body{flex-direction:row}
body.nav-left .page-area{order:2;flex:1;min-width:0}
body.nav-left .bottom-nav{
  order:1;
  flex-direction:column;
  flex-shrink:0;
  width:62px;min-height:unset;height:auto;
  border-top:none;border-bottom:none;
  border-right:1px solid var(--border);border-left:none;
  overflow-y:auto;overflow-x:hidden;
}
body.nav-left .nav-item{
  flex:0 0 auto;width:100%;
  border-top-color:transparent!important;border-bottom-color:transparent!important;
  border-right-color:transparent!important;
  border-left:3px solid transparent;
  padding:11px 2px;
}
body.nav-left .nav-item.active{
  border-left-color:var(--onion)!important;
  border-top-color:transparent!important;
  background:rgba(232,83,58,0.10);
}

/* ── NAV POSITION: RIGHT ────────────────────── */
body.nav-right .app-body{flex-direction:row}
body.nav-right .page-area{order:1;flex:1;min-width:0}
body.nav-right .bottom-nav{
  order:2;
  flex-direction:column;
  flex-shrink:0;
  width:62px;min-height:unset;height:auto;
  border-top:none;border-bottom:none;
  border-left:1px solid var(--border);border-right:none;
  overflow-y:auto;overflow-x:hidden;
}
body.nav-right .nav-item{
  flex:0 0 auto;width:100%;
  border-top-color:transparent!important;border-bottom-color:transparent!important;
  border-left-color:transparent!important;
  border-right:3px solid transparent;
  padding:11px 2px;
}
body.nav-right .nav-item.active{
  border-right-color:var(--onion)!important;
  border-top-color:transparent!important;
  background:rgba(232,83,58,0.10);
}

/* NAV: HIDE LABELS */
body.nav-nolabels .nav-label{display:none}
body.nav-nolabels .nav-item{padding:10px 2px}

/* ── NAV PILL + LEFT/RIGHT conflict fix ─────── */
/* When nav is vertical (left/right), pill border-radius looks wrong.
   Override pill styles so the position-specific indicator wins cleanly. */
body.nav-left.nav-pill .nav-item,
body.nav-right.nav-pill .nav-item{
  border-radius:0;
}
body.nav-left.nav-pill .nav-item.active,
body.nav-right.nav-pill .nav-item.active{
  background:rgba(232,83,58,0.10);
}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--card-padding);margin-bottom:9px;transition:border-color .15s}
.card:hover{border-color:var(--borderL)}
.stat-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px}
.stat-mini-lbl{font-size:10px;color:var(--dim)}
.stat-mini-val{font-weight:800;font-size:14px;margin-top:2px;font-family:'Baloo 2',sans-serif}

/* PAGE HEADER */
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.page-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;color:var(--white)}

/* BUTTONS */
.btn{border-radius:var(--radius-sm);padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;border:1.5px solid;transition:all .15s;font-family:'Noto Sans',sans-serif;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.btn-onion{background:var(--onion);border-color:var(--onion);color:#fff}
.btn-onion-o{background:transparent;border-color:var(--onion);color:var(--onion)}
.btn-cotton{background:var(--cotton);border-color:var(--cotton);color:#fff}
.btn-cotton-o{background:transparent;border-color:var(--cotton);color:var(--cotton)}
.btn-profit{background:var(--profit);border-color:var(--profit);color:#fff}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#000}
.btn-amber-o{background:transparent;border-color:var(--amber);color:var(--amber)}
.btn-danger{background:transparent;border-color:var(--loss);color:var(--loss)}
.btn-ghost{background:transparent;border-color:var(--borderL);color:var(--dim)}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn{flex:1}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.3px}

/* FORM */
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--input);border:1px solid var(--borderL);border-radius:var(--radius-sm);padding:8px 10px;color:var(--white);font-size:13px;font-family:'Noto Sans',sans-serif;outline:none;transition:border-color .15s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--onion)}
.field select option{background:var(--input);color:var(--white)}
.field textarea{resize:vertical;min-height:56px}
.field-row{display:grid;gap:8px}
.field-row.col2{grid-template-columns:1fr 1fr}
.field-row.col3{grid-template-columns:1fr 1fr 1fr}
.total-preview{background:var(--bg);border-radius:var(--radius-sm);padding:11px 12px;margin:10px 0;border:1px solid var(--border)}
.total-preview-lbl{font-size:10px;color:var(--dim);margin-bottom:3px}
.total-preview-val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--borderL);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:.7}to{transform:translateY(0);opacity:1}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--white)}
.modal-close{background:var(--bg);border:1px solid var(--borderL);color:var(--dim);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.modal-close:hover{color:var(--white)}

/* DASHBOARD STATS */
.dash-stat{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:var(--radius);border:1px solid;margin-bottom:8px;cursor:pointer;transition:all .15s}
.dash-stat:hover{filter:brightness(1.1)}
.dash-stat-label{font-size:11px;color:var(--dim);margin-top:2px}
.dash-stat-icon{font-size:20px;margin-bottom:3px}
.dash-stat-val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px}

/* ACTIVITY */
.activity-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-label{font-size:12px;color:var(--text)}
.activity-date{font-size:10px;color:var(--faint);margin-top:2px}
.activity-amt{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px}

/* PARTY CARD */
.party-card-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.party-stat-lbl{font-size:10px;color:var(--faint)}
.party-stat-val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;margin-top:1px}

/* TRANSACTION CARD */
.txn-meta{font-size:11px;color:var(--dim);margin-top:2px}
.txn-weight{font-size:10px;color:var(--faint);margin-top:4px}

/* REPORT */
.report-section-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;margin:14px 0 8px}
.pl-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.pl-row:last-child{border-bottom:none}
.pl-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.pl-total-lbl{font-size:12px;color:var(--dim)}
.pl-total-val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px}

/* FIREBASE SETUP MODAL */
.setup-step{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.setup-step-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--onion);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:22px;margin-right:8px;flex-shrink:0}
.setup-step-title{font-weight:700;font-size:13px;color:var(--white);display:flex;align-items:center;margin-bottom:6px}
.setup-step-desc{font-size:11px;color:var(--dim);line-height:1.6;margin-left:30px}
.setup-step-desc a{color:var(--cotton);text-decoration:none}
.copy-box{background:var(--input);border:1px solid var(--borderL);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--cotton);font-family:monospace;margin:6px 0 6px 30px;word-break:break-all;cursor:pointer;transition:border-color .2s}
.copy-box:hover{border-color:var(--cotton)}

/* SEARCH BAR */
.search-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.search-input{flex:1;background:var(--input);border:1px solid var(--borderL);border-radius:var(--radius-sm);padding:7px 10px;color:var(--white);font-size:12px;font-family:'Noto Sans',sans-serif;outline:none}
.search-input:focus{border-color:var(--onion)}
.search-input::placeholder{color:var(--faint)}
.filter-chip{padding:5px 10px;border-radius:20px;border:1.5px solid var(--borderL);font-size:10px;font-weight:700;cursor:pointer;color:var(--dim);background:var(--card);white-space:nowrap}
.filter-chip.active{border-color:var(--onion);color:var(--onion);background:var(--onion)15}
/* REPORT TABS */
.report-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
//  CONFIRM DIALOG (replaces native confirm())
// ═══════════════════════════════════════════════
function confirmDialog(msg, onOk, okLabel='Delete', okColor='var(--loss)') {
  // Create a second overlay on top of everything
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px';

        <button id="_cdCancel" style="flex:1;background:var(--card);border:1.5px solid var(--borderL);color:var(--dim);font-weight:700;font-size:13px;padding:9px;border-radius:8px;cursor:pointer">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('#_cdOk').onclick = () => { close(); onOk(); };
  overlay.querySelector('#_cdCancel').onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
}

// ═══════════════════════════════════════════════
//  SCHEMA VERSION & MIGRATION
// ═══════════════════════════════════════════════
const SCHEMA_VERSION = 5;

function migrateData(d) {
  // Ensure every record has the fields introduced in v5+
  (d.purchases||[]).forEach(p => {
    if (p.bags === undefined) p.bags = 0;
    if (p.notes === undefined) p.notes = '';
  });
  (d.sales||[]).forEach(s => {
    if (s.bags === undefined) s.bags = 0;
    if (s.notes === undefined) s.notes = '';
  });
  (d.payments||[]).forEach(p => {
    if (p.note === undefined) p.note = '';
  });
  (d.expenses||[]).forEach(e => {
    if (e.vendor === undefined) e.vendor = '';
    if (e.notes === undefined) e.notes = '';
    if (e.commodity === undefined) e.commodity = 'Onion';
  });
  (d.farmers||[]).forEach(f => {
    if (f.phone === undefined) f.phone = '';
  });
  (d.traders||[]).forEach(t => {
    if (t.phone === undefined) t.phone = '';
    if (t.city === undefined) t.city = '';
  });
  d._schemaVersion = SCHEMA_VERSION;
  return d;
}

// ═══════════════════════════════════════════════
//  LOCAL STORAGE
// ═══════════════════════════════════════════════
function loadLocal() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveLocal() {
  try {
    localStorage.setItem(SK, JSON.stringify(ensureArrays(data)));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
      // Storage full — prompt user to export immediately
      toast('⚠ Storage full! Please export a backup now.', true);
      setTimeout(() => {
        confirmDialog(
          'Your device storage is almost full. Your last change may not have saved. Export a backup now to protect your data.',
          exportJSON,
          'Export Backup',
          'var(--amber)'
        );
      }, 400);
    }
  }
}

// ═══════════════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════════════
function loadFirebaseConfig() {
  try {
    const raw = localStorage.getItem(FK);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + status;
  if (status === 'synced') lbl.textContent = '☁ Synced';
  else if (status === 'syncing') lbl.textContent = '↑ Syncing...';
  else if (status === 'offline') lbl.textContent = '⚠ Offline';
  else lbl.textContent = 'Local only';
}

// Use a counter (not boolean) to safely handle overlapping pushes
let _suppressCount = 0;

async function initFirebase(config) {
  if (!window._firebaseReady) {
    await new Promise(res => window.addEventListener('firebaseReady', res, {once:true}));
  }
  const { initializeApp, getDatabase, ref, set, onValue, off } = window._firebase;
  try {
    // Cleanly detach old listener and let the old app fall out of scope
    if (fbRef) { try { off(fbRef); } catch(e) {} }
    fbApp = initializeApp(config, 'agfarmedge-' + Date.now());
    fbDb = getDatabase(fbApp);
    fbRef = ref(fbDb, 'agfarmedge/data');
    fbConfig = config;
    localStorage.setItem(FK, JSON.stringify(config));
	idbSet('fb_config_backup', config);
    isListeningFirebase = true;
    setSyncStatus('syncing');

    // ── CRITICAL: Firebase is always the source of truth on reconnect.
    // Only seed Firebase if the DB is brand-new (null).
    onValue(fbRef, (snapshot) => {
      if (_suppressCount > 0) return;
      const val = snapshot.val();
      if (val && typeof val === 'object') {
        data = ensureArrays(migrateData(val));
        saveLocal();
        renderCurrentTab();
        setSyncStatus('synced');
      } else if (val === null) {
        // Empty DB — first device ever: push local data up
        pushToFirebase();
      }
    }, (err) => {
      setSyncStatus('offline');
      toast('Firebase error: ' + err.message, true);
    });

    return true;
  } catch(e) {
    toast('Firebase init failed: ' + e.message, true);
    return false;
  }
}

function pushToFirebase() {
  if (!fbRef || !window._firebaseReady) return;
  const { set } = window._firebase;
  setSyncStatus('syncing');
  _suppressCount++;
  set(fbRef, data)
    .then(() => { setSyncStatus('synced'); _suppressCount = Math.max(0, _suppressCount - 1); })
    .catch(e => {
      setSyncStatus('offline');
      _suppressCount = Math.max(0, _suppressCount - 1);
      toast('Sync failed — changes saved locally', true);
    });
}

// Flush any pending debounced sync immediately before the tab closes
window.addEventListener('beforeunload', () => {
  if (syncTimeout) {
    clearTimeout(syncTimeout);
    pushToFirebase();
  }
});

// Auto-reconnect when the device comes back online
window.addEventListener('online', () => {
  if (fbConfig && fbRef) {
    setSyncStatus('syncing');
    pushToFirebase();
    toast('Back online — syncing...');
  } else if (fbConfig && !fbRef) {
    // Connection was lost fully — re-init
    initFirebase(fbConfig);
  }
});
window.addEventListener('offline', () => setSyncStatus('offline'));

function saveData() {
  saveLocal();
  const cfg = loadFirebaseConfig(); if (cfg) idbSet('fb_config_backup', cfg);
  if (localFileHandle) {
    writeToPhysicalFile();
  }
  if (fbRef) {
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(pushToFirebase, 800);
  }
}

// ═══════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard() {
  const purchases = data.purchases || [];
  const sales = data.sales || [];
  const expenses = data.expenses || [];
  const farmers = data.farmers || [];
  const traders = data.traders || [];
  const payments = data.payments || [];

  const tP = purchases.reduce((s,p)=>s+p.totalAmount,0);
  const tS = sales.reduce((s,p)=>s+p.totalAmount,0);
  const tE = expenses.reduce((s,e)=>s+e.amount,0);
  const profit = tS - tP - tE;

  // Unified due calculations (consistent with Reports and Farmers/Traders pages)
  const totalFarmerDue = farmers.reduce((sum,f)=>{
    const fps = purchases.filter(p=>p.farmerId===f.id);
    const tot = fps.reduce((s,p)=>s+p.totalAmount,0);
    const paid = fps.reduce((s,p)=>s+p.paidAmount,0);
    const pmts = payments.filter(p=>p.type==='to_farmer'&&p.partyId===f.id).reduce((s,p)=>s+p.amount,0);
    return sum + Math.max(0, tot - paid - pmts);
  }, 0);

  const totalTraderDue = traders.reduce((sum,t)=>{
    const ts = sales.filter(s=>s.traderId===t.id);
    const tot = ts.reduce((s,x)=>s+x.totalAmount,0);
    const recv = ts.reduce((s,x)=>s+x.receivedAmount,0);
    const pmts = payments.filter(p=>p.type==='from_trader'&&p.partyId===t.id).reduce((s,p)=>s+p.amount,0);
    return sum + Math.max(0, tot - recv - pmts);
  }, 0);

  const stats = [
    {label:'Total Purchases', val:fmt(tP), color:C.onion, icon:'🧅', tab:'purchases'},
    {label:'Total Sales', val:fmt(tS), color:C.cotton, icon:'🏪', tab:'sales'},
    {label:'Total Expenses', val:fmt(tE), color:C.amber, icon:'💼', tab:'expenses'},
    {label:'Net Profit / Loss', val:fmt(profit), color:profit>=0?C.profit:C.loss, icon:profit>=0?'📈':'📉', tab:'reports'},
    {label:'Due to Farmers', val:fmt(totalFarmerDue), color:C.amber, icon:'👨‍🌾', tab:'farmers'},
    {label:'Due from Traders', val:fmt(totalTraderDue), color:C.purple, icon:'🏬', tab:'traders'},
  ];

  const recent = [
    ...purchases.map(p=>({date:p.date, label:'Bought from '+(farmers.find(f=>f.id===p.farmerId)?.name||'—'), amt:p.totalAmount, color:C.onion})),
    ...sales.map(s=>({date:s.date, label:'Sold to '+(traders.find(t=>t.id===s.traderId)?.name||'—'), amt:s.totalAmount, color:C.cotton}))
  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);

  document.getElementById('dashContent').innerHTML = `
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21px;color:var(--white);margin-bottom:2px">Dashboard</div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:14px">Business overview</div>
    ${stats.map(s=>`
    <div class="dash-stat" style="background:${s.color}0d;border-color:${s.color}30" onclick="goTab('${s.tab}')">
      <div><div class="dash-stat-icon">${s.icon}</div><div class="dash-stat-label">${s.label}</div></div>
      <div class="dash-stat-val" style="color:${s.color}">${s.val}</div>
    </div>`).join('')}
    <div style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:var(--white);margin:14px 0 8px">Recent Activity</div>
    ${recent.length ? recent.map(r=>`
    <div class="activity-item">
      <div><div class="activity-label">${esc(r.label)}</div><div class="activity-date">${r.date}</div></div>
      <div class="activity-amt" style="color:${r.color}">${fmt(r.amt)}</div>
    </div>`).join('') : '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No transactions yet</div></div>'}
    <div style="height:10px"></div>`;

function openPurchaseForm(id) {

function calcPTotal() {
  const w = parseFloat(document.getElementById('pW').value)||0;
  const r = parseFloat(document.getElementById('pR').value)||0;
  document.getElementById('pTotal').textContent = fmt(w*r);
}

function savePurchase(id) {
  const fId = parseInt(document.getElementById('pF').value);
  const wt = parseFloat(document.getElementById('pW').value);
  const rate = parseFloat(document.getElementById('pR').value);
  const dateVal = document.getElementById('pD').value;
  if (!fId || isNaN(fId)) return toast('Please select a farmer', true);
  if (!dateVal) return toast('Date is required', true);
  if (!wt || wt <= 0) return toast('Weight must be greater than 0', true);
  if (!rate || rate <= 0) return toast('Rate must be greater than 0', true);
  const bags = parseInt(document.getElementById('pB').value)||0;
  if (bags <= 0) return toast('Number of bags must be greater than 0', true);
  const total = wt * rate;
  const rawPaid = parseFloat(document.getElementById('pPaid').value)||0;
  const paid = Math.min(rawPaid, total);
  if (rawPaid > total) toast('Paid amount capped to total ₹' + total.toLocaleString('en-IN'), true);
  const rec = {
    farmerId:fId, date:dateVal,
    commodity:document.getElementById('pC').value,
    bags:bags,
    weightKg:wt, ratePerKg:rate, totalAmount:total,
    paidAmount:paid,
    notes:document.getElementById('pNotes').value
  };
  data.purchases = ensureArrays(data).purchases;
  if (id) data.purchases = data.purchases.map(x=>x.id===id?{...rec,id}:x);
  else data.purchases.push({...rec, id:uid()});
  saveData(); closeModal(); renderPurchases(); toast('Purchase saved \u2713');
}

function delPurchase(id) {
  confirmDialog('Delete this purchase? This cannot be undone.', () => {
    data.purchases = (data.purchases||[]).filter(x=>x.id!==id);
    saveData(); renderPurchases(); toast('Deleted');
  });
}

function openExpenseForm(id) {
  const e = id ? (data.expenses||[]).find(x=>x.id===id) : null;
  const cats = Object.keys(EXP_CATS);
  const defCat = e ? e.category : cats[0];
  openModal(`
    <div class="modal-hdr"><span class="modal-title">${e?'Edit Expense':'Add Expense'}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Date *</label><input type="date" id="eDate" value="${e?e.date:today()}" max="${today()}"></div>

    <div class="field"><label>Category *</label><select id="eCat" onchange="refreshExpSub('${e?e.subCategory:''}')">${cats.map(c=>`<option ${c===defCat?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Sub-Category</label><select id="eSub">${EXP_CATS[defCat].map(s=>`<option ${e&&s===e.subCategory?'selected':''}>${s}</option>`).join('')}</select></div>

    <div class="btn-row">
      <button class="btn btn-amber" onclick="saveExpense(${id||0})">${e?'Update Expense':'Save Expense'}</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>`);
}

function refreshExpSub(selectedSub) {
  const cat = document.getElementById('eCat').value;
  document.getElementById('eSub').innerHTML = EXP_CATS[cat].map(s=>`<option ${s===selectedSub?'selected':''}>${s}</option>`).join('');
}

function saveExpense(id) {
  const eDateVal = document.getElementById('eDate').value;
  const amt = parseFloat(document.getElementById('eAmt').value);
  if (!eDateVal) return toast('Date is required', true);
  if (!amt || amt<=0) return toast('Enter a valid amount', true);
  const rec = {
    date:eDateVal,
    category:document.getElementById('eCat').value,
    subCategory:document.getElementById('eSub').value,
    amount:amt, vendor:document.getElementById('eVendor').value,
    commodity:document.getElementById('eComm').value,
    notes:document.getElementById('eNotes').value
  };
  data.expenses = ensureArrays(data).expenses;
  if (id) data.expenses = data.expenses.map(x=>x.id===id?{...rec,id}:x);
  else data.expenses.push({...rec, id:uid()});
  saveData(); closeModal(); renderExpenses(); toast(id?'Expense updated ✓':'Expense saved ✓');
}

function delExpense(id) {
  confirmDialog('Delete this expense? This cannot be undone.', () => {
    data.expenses = (data.expenses||[]).filter(x=>x.id!==id);
    saveData(); renderExpenses(); toast('Deleted');
  });
}

function saveFarmer(id) {
  const name = document.getElementById('fName').value.trim();
  const village = document.getElementById('fVillage').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  if (!name) return toast('Farmer name is required', true);
  if (!village) return toast('Village is required', true);
  if (phone && !/^\d{10}$/.test(phone)) return toast('Phone must be a 10-digit number', true);
  const rec = {name, village, phone, commodity:document.getElementById('fComm').value};
  data.farmers = ensureArrays(data).farmers;
  if (id) data.farmers = data.farmers.map(x=>x.id===id?{...x,...rec}:x);
  else data.farmers.push({...rec, id:uid()});
  saveData(); closeModal(); renderFarmers(); toast('Farmer saved ✓');
}

function delFarmer(id) {
  const linkedPurchases = (data.purchases||[]).filter(p=>p.farmerId===id).length;
  const msg = linkedPurchases > 0
    ? `This farmer has ${linkedPurchases} purchase record(s) linked to them. Their name will show as "—" in those records. Delete anyway?`
    : 'Delete this farmer?';
  confirmDialog(msg, () => {
    data.farmers = (data.farmers||[]).filter(x=>x.id!==id);
    saveData(); renderFarmers(); toast('Deleted');
  });
}

let reportTab = 'pl';
let reportFrom = '';
let reportTo = '';

function renderReports() {
  const purchases = data.purchases || [];
  const sales     = data.sales     || [];
  const expenses  = data.expenses  || [];
  const payments  = data.payments  || [];
  const farmers   = data.farmers   || [];
  const traders   = data.traders   || [];

  // date filter
  const inRange = date => {
    if (reportFrom && date < reportFrom) return false;
    if (reportTo   && date > reportTo)   return false;
    return true;
  };
  const fP = purchases.filter(x=>inRange(x.date));
  const fS = sales.filter(x=>inRange(x.date));
  const fE = expenses.filter(x=>inRange(x.date));

  const tP = fP.reduce((s,p)=>s+p.totalAmount,0);
  const tS = fS.reduce((s,p)=>s+p.totalAmount,0);
  const tE = fE.reduce((s,e)=>s+e.amount,0);
  const profit = tS - tP - tE;
  const margin = tS > 0 ? ((profit/tS)*100).toFixed(1) : '0.0';

  // commodity breakdown
  const onionP = fP.filter(x=>x.commodity==='Onion').reduce((s,x)=>s+x.totalAmount,0);
  const cottonP = fP.filter(x=>x.commodity==='Cotton').reduce((s,x)=>s+x.totalAmount,0);
  const onionS = fS.filter(x=>x.commodity==='Onion').reduce((s,x)=>s+x.totalAmount,0);
  const cottonS = fS.filter(x=>x.commodity==='Cotton').reduce((s,x)=>s+x.totalAmount,0);
  const onionE = fE.filter(x=>x.commodity==='Onion').reduce((s,x)=>s+x.amount,0);
  const cottonE = fE.filter(x=>x.commodity==='Cotton').reduce((s,x)=>s+x.amount,0);
  const onionProfit = onionS - onionP - onionE;
  const cottonProfit = cottonS - cottonP - cottonE;

  // expense by category
  const catColors = {Transport:C.cotton, Labour:C.profit, Packaging:C.amber, Other:C.purple};
  const catTotals = {};
  fE.forEach(e=>{ catTotals[e.category]=(catTotals[e.category]||0)+e.amount; });
  const catMax = Math.max(...Object.values(catTotals), 1);

  // dues (all-time, not date-filtered — dues are current outstanding)
  const fDues = farmers.map(f=>{
    const fps = purchases.filter(p=>p.farmerId===f.id);
    const tot = fps.reduce((s,p)=>s+p.totalAmount,0);
    const paid = fps.reduce((s,p)=>s+p.paidAmount,0);
    const pmts = payments.filter(p=>p.type==='to_farmer'&&p.partyId===f.id).reduce((s,p)=>s+p.amount,0);
    return {name:f.name, village:f.village, due:tot-paid-pmts};
  }).filter(x=>x.due>0).sort((a,b)=>b.due-a.due);

  const tDues = traders.map(t=>{
    const ts = sales.filter(s=>s.traderId===t.id);
    const tot = ts.reduce((s,x)=>s+x.totalAmount,0);
    const recv = ts.reduce((s,x)=>s+x.receivedAmount,0);
    const pmts = payments.filter(p=>p.type==='from_trader'&&p.partyId===t.id).reduce((s,p)=>s+p.amount,0);
    return {name:t.name, city:t.city, due:tot-recv-pmts};
  }).filter(x=>x.due>0).sort((a,b)=>b.due-a.due);

  const tabBtn = (id,label) => `<div class="report-tab ${reportTab===id?'active':''}" onclick="reportTab='${id}';renderReports()">${label}</div>`;

  const plHtml = `
    <div class="card" style="border-color:${C.cotton}30;margin-bottom:10px">
      <div style="font-weight:700;font-size:13px;color:var(--white);margin-bottom:10px">📊 Overall P&amp;L</div>
      <div class="pl-row"><span style="color:var(--dim)">Revenue (Sales)</span><span style="color:${C.cotton};font-weight:700">${fmt(tS)}</span></div>
      <div class="pl-row"><span style="color:var(--dim)">Cost (Purchases)</span><span style="color:${C.onion};font-weight:700">${fmt(tP)}</span></div>
      <div class="pl-row"><span style="color:var(--dim)">Expenses</span><span style="color:${C.amber};font-weight:700">${fmt(tE)}</span></div>
      <div class="pl-row" style="border-bottom:none"><span style="color:var(--dim)">Profit Margin</span><span style="color:${profit>=0?C.profit:C.loss};font-weight:700">${margin}%</span></div>
      <div class="pl-total" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <span class="pl-total-lbl">Net ${profit>=0?'Profit':'Loss'}</span>
        <span class="pl-total-val" style="color:${profit>=0?C.profit:C.loss}">${fmt(Math.abs(profit))}</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div class="card" style="border-color:${C.onion}30">
        <div style="font-size:10px;color:${C.onion};font-weight:700;margin-bottom:6px">🧅 ONION</div>
        <div class="pl-row" style="padding:4px 0"><span style="color:var(--dim);font-size:11px">Sales</span><span style="font-size:11px;font-weight:700;color:${C.cotton}">${fmt(onionS)}</span></div>
        <div class="pl-row" style="padding:4px 0"><span style="color:var(--dim);font-size:11px">Purchases</span><span style="font-size:11px;font-weight:700;color:${C.onion}">${fmt(onionP)}</span></div>
        <div class="pl-row" style="padding:4px 0;border:none"><span style="color:var(--dim);font-size:11px">Expenses</span><span style="font-size:11px;font-weight:700;color:${C.amber}">${fmt(onionE)}</span></div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:${onionProfit>=0?C.profit:C.loss}">${fmt(onionProfit)}</div>
      </div>
      <div class="card" style="border-color:${C.cotton}30">
        <div style="font-size:10px;color:${C.cotton};font-weight:700;margin-bottom:6px">🌿 COTTON</div>
        <div class="pl-row" style="padding:4px 0"><span style="color:var(--dim);font-size:11px">Sales</span><span style="font-size:11px;font-weight:700;color:${C.cotton}">${fmt(cottonS)}</span></div>
        <div class="pl-row" style="padding:4px 0"><span style="color:var(--dim);font-size:11px">Purchases</span><span style="font-size:11px;font-weight:700;color:${C.onion}">${fmt(cottonP)}</span></div>
        <div class="pl-row" style="padding:4px 0;border:none"><span style="color:var(--dim);font-size:11px">Expenses</span><span style="font-size:11px;font-weight:700;color:${C.amber}">${fmt(cottonE)}</span></div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:${cottonProfit>=0?C.profit:C.loss}">${fmt(cottonProfit)}</div>
      </div>
    </div>`;

  const expHtml = `
    <div class="card">
      <div style="font-weight:700;font-size:13px;color:var(--white);margin-bottom:12px">📂 Expenses by Category</div>
      ${tE===0?`<div style="color:var(--dim);font-size:12px">No expenses in this period.</div>`:
        Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
        <div class="cat-bar-row">
          <div class="cat-bar-label">${cat}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(amt/catMax*100)}%;background:${catColors[cat]||C.dim}"></div></div>
          <div class="cat-bar-val">${fmt(amt)}</div>
        </div>`).join('')}
      ${tE>0?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between"><span style="color:var(--dim);font-size:12px">Total Expenses</span><span style="font-weight:700;color:${C.amber}">${fmt(tE)}</span></div>`:''}
    </div>`;

  const duesHtml = `
    <div class="report-section-title" style="color:${C.amber}">👨‍🌾 Due to Farmers <span style="font-size:11px;font-weight:400">(current outstanding)</span></div>
    ${fDues.length ? fDues.map(f=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:700;color:var(--white)">${esc(f.name)}</div><div class="txn-meta">${esc(f.village)}</div></div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:${C.amber}">${fmt(f.due)}</div>
    </div>`).join('') : `<div style="color:${C.profit};font-size:13px;margin-bottom:12px">✓ All farmers fully paid</div>`}

function exportCSV() {
  const rows = [['Type','Date','Party','Commodity','Bags','Weight(kg)','Rate/kg','Total','Paid/Received','Due','Notes']];
  const farmers = data.farmers||[], traders = data.traders||[];
  (data.purchases||[]).forEach(p=>{
    const f = farmers.find(x=>x.id===p.farmerId);
    rows.push(['Purchase',p.date,f?.name||'—',p.commodity,p.bags,p.weightKg,p.ratePerKg,p.totalAmount,p.paidAmount,p.totalAmount-p.paidAmount,p.notes||'']);
  });
  (data.sales||[]).forEach(s=>{
    const t = traders.find(x=>x.id===s.traderId);
    rows.push(['Sale',s.date,t?.name||'—',s.commodity,s.bags,s.weightKg,s.ratePerKg,s.totalAmount,s.receivedAmount,s.totalAmount-s.receivedAmount,s.notes||'']);
  });
  (data.payments||[]).forEach(p=>{
    const isF = p.type==='to_farmer';
    const party = isF?farmers.find(x=>x.id===p.partyId):traders.find(x=>x.id===p.partyId);
    rows.push([isF?'Payment-ToFarmer':'Payment-FromTrader',p.date,party?.name||'—','','',' ','',p.amount,p.amount,'',p.note||'']);
  });
  (data.expenses||[]).forEach(e=>{
    rows.push(['Expense',e.date,e.vendor||'—',e.commodity,'','','',e.amount,'','',`${e.category}/${e.subCategory} ${e.notes||''}`]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `AGFarmedge_${today()}.csv`;
  a.click();
  toast('CSV exported ✓');
}

async function connectFirebase() {
  const apiKey     = document.getElementById('fbApiKey').value.trim();
  const authDomain = document.getElementById('fbAuthDomain').value.trim();
  const databaseURL= document.getElementById('fbDbUrl').value.trim();
  const projectId  = document.getElementById('fbProjectId').value.trim();
  if (!apiKey)       return toast('API Key is required', true);
  if (!databaseURL)  return toast('Database URL is required', true);
  if (!projectId)    return toast('Project ID is required', true);
  const cleanedDbUrl = databaseURL.replace(/\/$/, "");
  if (!cleanedDbUrl.includes('firebaseio.com') && !cleanedDbUrl.includes('firebasedatabase.app')) {
  return toast('Invalid Database URL format', true);
}
  const config = { apiKey, authDomain, databaseURL: cleanedDbUrl, projectId };
  toast('Connecting to Firebase...');
  const ok = await initFirebase(config);
  if (ok) { closeModal(); toast('☁ Connected! Pulling latest data...'); }
}

function disconnectFirebase() {
  confirmDialog('Disconnect Firebase? Your data will remain saved locally on this device.', () => {
    if (fbRef) { try { window._firebase.off(fbRef); } catch(e) {} }
    fbApp = null; fbDb = null; fbRef = null; fbConfig = null;
    isListeningFirebase = false;
    localStorage.removeItem(FK);
    setSyncStatus('');
    closeModal(); toast('Disconnected from Firebase');
  }, 'Disconnect', 'var(--loss)');
}

function exportJSON() {
  const payload = JSON.stringify({_version:4, _exported:today(), ...ensureArrays(data)}, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `AGFarmedge_backup_${today()}.json`;
  a.click();
  markBackupDone();
  toast('Backup downloaded ✓');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.farmers && !parsed.purchases && !parsed.sales) {
        return toast('Invalid backup file', true);
      }
      confirmDialog(
        `Restore backup from ${parsed._exported||'unknown date'}? This will replace ALL current data (${(data.purchases||[]).length} purchases, ${(data.sales||[]).length} sales, etc.) with the backup's data.`,
        () => {
          data = ensureArrays(parsed);
          saveData();
          renderCurrentTab();
          closeModal();
          toast('Backup restored ✓');
        },
        'Restore', 'var(--amber)'
      );
    } catch(err) {
      toast('Could not read file: ' + err.message, true);
    }
  };
  reader.readAsText(file);
  input.value = ''; // reset so same file can be re-selected
}

  light:   {name:'Light',     colors:['#f0f2f7','#ffffff','#e8533a','#4fa8e8','#3db87a']},

const CK = 'agfarmedge_customization';

const DEFAULT_CUSTOMIZATION = {
  theme: 'dark',
  density: 'default',
  radius: 'default',
  navStyle: 'default',
  navPosition: 'bottom',
  navLabels: true,
  font: 'default',
  fontSize: 13,
  iconSize: 17,
  accentColor: '',
  primaryColor: '',
  logoText: 'AG Farmedge Global',
  logoSub: 'Onion & Cotton Traders',
  logoIcon: '🌿',
  cardShadow: false,
  animationsOff: false,
};

let customization = {...DEFAULT_CUSTOMIZATION};

function loadCustomization() {
  try {
    const raw = localStorage.getItem(CK);
    if (raw) return {...DEFAULT_CUSTOMIZATION, ...JSON.parse(raw)};
  } catch(e) {}
  return {...DEFAULT_CUSTOMIZATION};
}

function saveCustomization() {
  try { localStorage.setItem(CK, JSON.stringify(customization)); } catch(e) {}
}

function applyCustomization() {
  const b = document.body;
  const root = document.documentElement;

  // Theme
  b.className = b.className.replace(/\btheme-\S+/g,'').trim();
  if (customization.theme !== 'dark') b.classList.add('theme-' + customization.theme);

  // Density
  b.className = b.className.replace(/\bdensity-\S+/g,'').trim();
  if (customization.density !== 'default') b.classList.add('density-' + customization.density);

  // Radius
  b.className = b.className.replace(/\bradius-\S+/g,'').trim();
  if (customization.radius !== 'default') b.classList.add('radius-' + customization.radius);

  // Nav style + position — remove ALL nav-* classes first
  b.className = b.className.replace(/\bnav-\S+/g,'').trim();
  if (customization.navStyle !== 'default') b.classList.add('nav-' + customization.navStyle);
  // Nav position (bottom is default — no extra class needed)
  const pos = customization.navPosition || 'bottom';
  if (pos === 'left')  b.classList.add('nav-left');
  if (pos === 'right') b.classList.add('nav-right');
  if (pos === 'top')   b.classList.add('nav-top');
  if (!customization.navLabels) b.classList.add('nav-nolabels');

  // Font
  b.className = b.className.replace(/\bfont-\S+/g,'').trim();
  if (customization.font !== 'default') b.classList.add('font-' + customization.font);

  // Animations off
  b.classList.toggle('no-animations', !!customization.animationsOff);

  // Font size
  const fs = Math.min(Math.max(customization.fontSize || 13, 9), 20);
  root.style.setProperty('--font-size-base', fs + 'px');

  // Icon size
  const is = Math.min(Math.max(customization.iconSize || 17, 10), 32);
  root.style.setProperty('--nav-icon-size', is + 'px');
  // Scale nav label size proportionally
  root.style.setProperty('--nav-label-size', Math.max(7, Math.round(is * 0.55)) + 'px');
  // Scale nav height to fit icons
  const nh = Math.max(46, Math.round(is * 3.4));
  root.style.setProperty('--nav-height', nh + 'px');

  // Card shadow
  const cardShadowStyle = document.getElementById('cardShadowStyle');
  if (cardShadowStyle) {
    cardShadowStyle.textContent = customization.cardShadow
      ? '.card{box-shadow:0 4px 18px rgba(0,0,0,.35)!important}'
      : '';
  }

  // Accent color override — also sync the C object so rendered HTML uses correct color
  if (customization.accentColor) {
    root.style.setProperty('--onion', customization.accentColor);
    C.onion = customization.accentColor;
  } else {
    root.style.removeProperty('--onion');
    const themeDefaults = {
      dark:'#e8533a', light:'#d44020', forest:'#5db87a',
      saffron:'#f07020', ocean:'#20a8e8', slate:'#e06060'
    };
    C.onion = themeDefaults[customization.theme] || '#e8533a';
  }

  if (customization.primaryColor) {
    root.style.setProperty('--cotton', customization.primaryColor);
    C.cotton = customization.primaryColor;
  } else {
    root.style.removeProperty('--cotton');
    const themeDefaults = {
      dark:'#4fa8e8', light:'#1a7ec8', forest:'#48c890',
      saffron:'#e8a030', ocean:'#40c0f8', slate:'#60a8e0'
    };
    C.cotton = themeDefaults[customization.theme] || '#4fa8e8';
  }

  // Re-sync COMM_COLOR too
  COMM_COLOR.Onion = C.onion;
  COMM_COLOR.Cotton = C.cotton;

  // Branding
  const lt = document.querySelector('.logo-text');
  const ls = document.querySelector('.logo-sub');
  const li = document.querySelector('.logo-icon');
  if (lt) lt.textContent = customization.logoText || 'AG Farmedge Global';
  if (ls) ls.textContent = customization.logoSub || 'Onion & Cotton Traders';
  if (li) li.textContent = customization.logoIcon || '🌿';
}

  customization[key] = val;

        <input type="color" value="${c.primaryColor || '#4fa8e8'}" onchange="setCustom('primaryColor',this.value)">
        ${c.primaryColor ? `<button class="btn btn-ghost btn-xs" onclick="setCustom('primaryColor','')">Reset</button>` : ''}
      </div>
    </div>

    <!-- TYPOGRAPHY & FONT SIZE -->
    <div class="settings-section">
      <div class="settings-section-title">🔤 Typography</div>
      <div class="option-row" style="margin-bottom:12px">
        ${chip('Noto Sans','font','default')}
        ${chip('Baloo 2','font','baloo')}
        ${chip('Monospace','font','mono')}
      </div>
      <div class="range-row">
        <label>Font Size</label>
        <input type="range" min="9" max="20" value="${fs}" step="1"
          oninput="this.nextElementSibling.textContent=this.value+'px';setCustom('fontSize',parseInt(this.value))">
        <span>${fs}px</span>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <div style="font-size:${Math.max(9,fs-3)}px;color:var(--dim)">Small text</div>
        <div style="font-size:${fs}px;color:var(--text)">Normal text</div>
        <div style="font-size:${Math.min(20,fs+3)}px;color:var(--white);font-weight:700">Large text</div>
      </div>
    </div>

    <!-- NAVIGATION -->
    <div class="settings-section">
      <div class="settings-section-title">🧭 Navigation</div>

      <div style="font-size:10px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Style</div>
      <div class="option-row" style="margin-bottom:12px">
        ${chip('Default','navStyle','default')}
        ${chip('Pill','navStyle','pill')}
      </div>

      <div style="font-size:10px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Position</div>
      <div class="option-row" style="margin-bottom:12px">
        ${chip('⬇ Bottom','navPosition','bottom')}
        ${chip('⬆ Top','navPosition','top')}
        ${chip('◀ Left','navPosition','left')}
        ${chip('▶ Right','navPosition','right')}
      </div>

      <div style="font-size:10px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Icon Size</div>
      <div class="range-row">
        <label>Nav Icons</label>
        <input type="range" min="10" max="32" value="${is}" step="1"
          oninput="this.nextElementSibling.textContent=this.value+'px';setCustom('iconSize',parseInt(this.value))">
        <span>${is}px</span>
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:6px;padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)">
        <span style="font-size:${Math.max(10,is-5)}px">📊</span>
        <span style="font-size:${is}px">📊</span>
        <span style="font-size:${Math.min(32,is+5)}px">📊</span>
        <span style="font-size:10px;color:var(--dim)">← preview</span>
      </div>

      <div style="margin-top:10px">
        ${toggle('Show Labels','navLabels')}
      </div>
    </div>

    <!-- LAYOUT DENSITY -->
    <div class="settings-section">
      <div class="settings-section-title">📐 Layout Density</div>
      <div class="option-row">
        ${chip('Compact','density','compact')}
        ${chip('Default','density','default')}
        ${chip('Comfortable','density','comfortable')}
      </div>
    </div>

    <!-- BORDER RADIUS -->
    <div class="settings-section">
      <div class="settings-section-title">⬛ Corner Style</div>
      <div class="option-row">
        ${chip('Sharp','radius','sharp')}
        ${chip('Default','radius','default')}
        ${chip('Rounded','radius','medium')}
        ${chip('Pill','radius','pill')}
      </div>
    </div>

    <!-- CARDS & EFFECTS -->
    <div class="settings-section">
      <div class="settings-section-title">✨ Card Effects</div>
      <div class="option-row">
        ${toggle('Card Shadows','cardShadow')}
        ${toggle('Reduce Animations','animationsOff')}
      </div>
    </div>

    <!-- BRANDING -->
    <div class="settings-section">
      <div class="settings-section-title">🏷 App Branding</div>
      <div class="brand-preview">
        <span style="font-size:22px" id="previewIcon">${c.logoIcon||'🌿'}</span>
        <div>
          <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--white)" id="previewText">${c.logoText||'AG Farmedge Global'}</div>
          <div style="font-size:9px;color:var(--onion);font-weight:700;letter-spacing:1px;text-transform:uppercase" id="previewSub">${c.logoSub||'Onion &amp; Cotton Traders'}</div>
        </div>
      </div>
      <div class="field"><label>App Icon (Emoji)</label><input type="text" id="bIcon" value="${c.logoIcon||'🌿'}" placeholder="🌿" maxlength="4" oninput="updateBrandPreview()"></div>
      <div class="field"><label>App Name</label><input type="text" id="bText" value="${c.logoText||'AG Farmedge Global'}" placeholder="AG Farmedge Global" oninput="updateBrandPreview()"></div>
      <div class="field"><label>Tagline</label><input type="text" id="bSub" value="${c.logoSub||'Onion & Cotton Traders'}" placeholder="Onion & Cotton Traders" oninput="updateBrandPreview()"></div>
      <button class="btn btn-onion btn-sm" onclick="saveBranding()">Apply Branding</button>
    </div>

    <!-- RESET -->
    <div class="reset-section">
      <div class="settings-section-title">⚠️ Reset</div>
      <button class="btn btn-danger btn-sm" onclick="resetCustomization()">Reset All Customizations</button>
      <div style="margin-top:10px">
        <button class="btn btn-danger btn-sm" onclick="resetAllData()">🗑 Clear All Data</button>
        <div style="font-size:10px;color:var(--faint);margin-top:5px">Removes all purchases, sales, payments, expenses, farmers &amp; traders. Cannot be undone.</div>
      </div>
    </div>

    <!-- BACKUP -->
    <div class="settings-section" style="margin-top:16px">
      <div class="settings-section-title">💾 Data Backup</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:10px">Export your data as a JSON file. Restore it later or transfer to another device.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-onion btn-sm" onclick="selectLocalBackupFile()">🔒 Link Hard Drive File (Auto-Save)</button>
	<button class="btn btn-ghost btn-sm" onclick="exportJSON()">⬇ Export Backup</button>
        <button class="btn btn-ghost btn-sm" onclick="openFirebaseSetup();setTimeout(()=>showSyncTab('backup'),100)">⬆ Restore Backup</button>
        <button class="btn btn-ghost btn-sm" onclick="openFirebaseSetup()">☁ Firebase Sync</button>
      </div>
    </div>
    <div style="height:16px"></div>`;
}

function updateBrandPreview() {
  const icon = document.getElementById('bIcon')?.value || '🌿';
  const text = document.getElementById('bText')?.value || 'AG Farmedge Global';
  const sub = document.getElementById('bSub')?.value || 'Onion & Cotton Traders';
  const pi = document.getElementById('previewIcon'); if(pi) pi.textContent = icon;
  const pt = document.getElementById('previewText'); if(pt) pt.textContent = text;
  const ps = document.getElementById('previewSub'); if(ps) ps.textContent = sub;
}

function saveBranding() {
  customization.logoIcon = document.getElementById('bIcon').value || '🌿';
  customization.logoText = document.getElementById('bText').value || 'AG Farmedge Global';
  customization.logoSub = document.getElementById('bSub').value || 'Onion & Cotton Traders';
  saveCustomization();
  applyCustomization();
  toast('Branding updated ✓');
}

function resetCustomization() {
  confirmDialog('Reset all customizations to defaults? Theme, fonts, layout and branding will revert.', () => {
    customization = {...DEFAULT_CUSTOMIZATION};
    saveCustomization();
    applyCustomization();
    renderSettings();
    toast('Reset to defaults');
  }, 'Reset', 'var(--amber)');
}

function resetAllData() {
  confirmDialog('Clear ALL data? This removes all farmers, traders, purchases, sales, payments and expenses. Cannot be undone.', () => {
    data = ensureArrays({});
    saveData();
    renderCurrentTab();
    toast('All data cleared');
  });
}

// ═══════════════════════════════════════════════
//  BACKUP REMINDER
// ═══════════════════════════════════════════════
const BACKUP_KEY = 'agfarmedge_last_backup';

function markBackupDone() {
  localStorage.setItem(BACKUP_KEY, today());
}

function checkBackupReminder() {
  // Only remind if there's real data to protect
  const hasData = (data.purchases||[]).length + (data.sales||[]).length > 0;
  if (!hasData) return;
  const last = localStorage.getItem(BACKUP_KEY);
  if (!last) { scheduleBackupToast(); return; }
  const daysSince = Math.floor((new Date(today()) - new Date(last)) / 86400000);
  if (daysSince >= 7) scheduleBackupToast();
}

function scheduleBackupToast() {
  setTimeout(() => {
    confirmDialog(
      "You haven't exported a backup in a while. It's quick and protects your data if the browser clears storage.",
      () => { exportJSON(); markBackupDone(); },
      '⬇ Export Now',
      'var(--amber)'
    );
  }, 3000);
}

// ═══════════════════════════════════════════════
//  SAFE DATA HELPERS
// ═══════════════════════════════════════════════
async function selectLocalBackupFile() {
  try {
    const options = {
      suggestedName: `AGFarmedge_Live_Ledger.json`,
      types: [{
        description: 'JSON Backup File',
        accept: { 'application/json': ['.json'] },
      }],
    };
    localFileHandle = await window.showSaveFilePicker(options);
    toast('Physical file linked successfully! App will now auto-save here ✓');
    await writeToPhysicalFile();
  } catch (err) {
    if (err.name !== 'AbortError') {
      toast('File access denied: ' + err.message, true);
    }
  }
}

async function writeToPhysicalFile() {
  if (!localFileHandle) return;
  try {
    const options = { mode: 'readwrite' };
    if ((await localFileHandle.queryPermission(options)) !== 'granted') {
      if ((await localFileHandle.requestPermission(options)) !== 'granted') {
        return;
      }
    }
    const writable = await localFileHandle.createWritable();
    const payload = JSON.stringify({ _version: 5, _lastUpdated: new Date().toISOString(), ...ensureArrays(data) }, null, 2);
    await writable.write(payload);
    await writable.close();
    console.log('[Farmedge] Hard drive sync completed successfully.');
  } catch (err) {
    console.error('Failed to write auto-save file:', err);
  }
}
function ensureArrays(d) {
  d.farmers   = Array.isArray(d.farmers)   ? d.farmers   : [];
  d.traders   = Array.isArray(d.traders)   ? d.traders   : [];
  d.purchases = Array.isArray(d.purchases) ? d.purchases : [];
  d.sales     = Array.isArray(d.sales)     ? d.sales     : [];
  d.payments  = Array.isArray(d.payments)  ? d.payments  : [];
  d.expenses  = Array.isArray(d.expenses)  ? d.expenses  : [];
  return d;
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
(async function init() {
  // Load customization first
  customization = loadCustomization();
  applyCustomization();

  const local = loadLocal();
  data = ensureArrays(migrateData(local || JSON.parse(JSON.stringify(DEFAULT_DATA))));
  if (!local) saveLocal();
  renderDashboard();

  let cfg = loadFirebaseConfig();
  if (!cfg) {
    const backupCfg = await idbGet('fb_config_backup');
    if (backupCfg && backupCfg.apiKey) {
      cfg = backupCfg;
      // Restore to localStorage so your form fields stay populated next time
      localStorage.setItem(FK, JSON.stringify(cfg)); 
    }
  }

  if (cfg) {
    setSyncStatus('syncing');
    await initFirebase(cfg);
  } else {
    setSyncStatus('');
  }

  // Periodic backup reminder: if no export in 7+ days, show a gentle nudge
  checkBackupReminder();
})();
</script>
